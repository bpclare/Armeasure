# Every push to main: the unit tests, then a signed APK published as a GitHub release tagged v<code>. The app checks
# the latest release on launch and offers INSTALL when it is newer than itself (app/.../update/Updater.kt).
#
# The signing key is app/release.keystore (committed, encrypted by its password); the password is the repo secret
# KEYSTORE_PASSWORD (Settings → Secrets and variables → Actions). Every build must be signed by the same key, or
# Android refuses the update.
name: release

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: The signing key's password
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Add the KEYSTORE_PASSWORD secret: Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      # The code is the run number + 1, so it climbs with every build (build 1 was the first one installed by hand).
      - name: Build the APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          code=$(( ${{ github.run_number }} + 1 ))
          echo "CODE=$code" >> "$GITHUB_ENV"
          ./gradlew assembleRelease --no-daemon -PversionCode=$code -PupdateRepo=${{ github.repository }}

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "measure-$CODE.apk"
          git log -1 --format=%B > notes.txt
          gh release create "v$CODE" "measure-$CODE.apk" --title "Build $CODE" --notes-file notes.txt --latest
